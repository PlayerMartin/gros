services:
  app:
    build: .
    image: gros:local
    container_name: gros
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # SQLite database + WAL files persist on the host.
      # On Linux hosts: chown -R 1000:1000 ./data (the image runs as uid 1000).
      - ./data:/app/data
    restart: unless-stopped